name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: itsdarklikehell/ci-templates/.github/workflows/ci-node.yml@v1
    with:
      node-version: "20"
      # build skipped at fleet rollout (some apps need deploy env); enable per-repo later
      build-command: "skip"
